<svg xmlns="http://www.w3.org/2000/svg" width="480" height="296" viewBox="0 0 480 296" role="img" aria-label="Software Developer for web, mobile, backend and cloud. Tap the dumbbell to unlock profile details.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/><stop offset="0.5" stop-color="#9ca3af"/><stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca3af"/><stop offset="0.5" stop-color="#4b5563"/><stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <pattern id="knurl" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1f2937" stroke-opacity="0.45" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="0.35" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="react" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/><stop offset="0.35" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowG">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.55"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .lift { animation: lift 7.5s ease-in-out infinite; }
    @keyframes lift {
      0% { transform: translateY(0); }
      10% { transform: translateY(-26px) rotate(-2deg); }
      21% { transform: translateY(0); }
      32% { transform: translateY(-26px) rotate(2deg); }
      43% { transform: translateY(0); }
      53%, 88% { transform: translateY(-26px) rotate(0deg); }
      100% { transform: translateY(0); }
    }
    .shadow { animation: shadow 7.5s ease-in-out infinite; }
    @keyframes shadow {
      0%, 21%, 43%, 100% { transform: scaleX(1); opacity: 1; }
      10%, 32%, 53%, 88% { transform: scaleX(0.66); opacity: 0.45; }
    }
    .glow { animation: glow 7.5s ease-in-out infinite; }
    @keyframes glow { 0%, 52% { opacity: 0; } 58%, 88% { opacity: 1; } 100% { opacity: 0; } }
    .c0 { animation: c0 7.5s linear infinite; }
    .c1 { animation: c1 7.5s linear infinite; }
    .c2 { animation: c2 7.5s linear infinite; }
    .c3 { animation: c3 7.5s linear infinite; }
    @keyframes c0 { 0%, 9% { opacity: 1; } 10%, 99% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes c1 { 0%, 9% { opacity: 0; } 10%, 31% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @keyframes c2 { 0%, 31% { opacity: 0; } 32%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
    @keyframes c3 { 0%, 52% { opacity: 0; } 53%, 99% { opacity: 1; } 100% { opacity: 0; } }
    .fill { transform-box: fill-box; transform-origin: left center; animation: fill 7.5s ease-out infinite; }
    @keyframes fill {
      0%, 9% { transform: scaleX(0.02); }
      12%, 31% { transform: scaleX(0.33); }
      34%, 52% { transform: scaleX(0.66); }
      55%, 99% { transform: scaleX(1); }
      100% { transform: scaleX(0.02); }
    }
    .loading { animation: loading 7.5s linear infinite; }
    @keyframes loading { 0%, 53% { opacity: 1; } 55%, 99% { opacity: 0; } 100% { opacity: 1; } }
    .unlocked { animation: unlocked 7.5s ease-in-out infinite; }
    @keyframes unlocked { 0%, 54% { opacity: 0; } 58%, 66%, 82% { opacity: 1; } 74%, 90% { opacity: 0.55; } 99% { opacity: 1; } 100% { opacity: 0; } }
    .spark { animation: spark 7.5s ease-out infinite; }
    @keyframes spark { 0%, 52% { opacity: 0; transform: scale(0.2); } 57% { opacity: 1; transform: scale(1.15); } 66%, 100% { opacity: 0; transform: scale(1.5); } }
    .sweatL { animation: sweatL 7.5s ease-out infinite; }
    .sweatR { animation: sweatR 7.5s ease-out infinite; }
    @keyframes sweatL {
      0%, 8%, 30%, 51%, 100% { opacity: 0; transform: translate(0, 0); }
      11%, 33%, 54% { opacity: 1; transform: translate(-3px, -3px); }
      17%, 39%, 60% { opacity: 0; transform: translate(-12px, -10px); }
    }
    @keyframes sweatR {
      0%, 8%, 30%, 51%, 100% { opacity: 0; transform: translate(0, 0); }
      11%, 33%, 54% { opacity: 1; transform: translate(3px, -3px); }
      17%, 39%, 60% { opacity: 0; transform: translate(12px, -10px); }
    }
  </style>

  <text x="240" y="26" text-anchor="middle" font-size="14.5" fill="#6e7781" letter-spacing="0.3">Software Developer · web, mobile, backend &amp; cloud</text>

  <g transform="translate(0 -6)">
  <!-- side displays -->
  <rect x="18" y="118" width="78" height="62" rx="12" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-opacity="0.4"/>
  <text x="57" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6e7781" letter-spacing="2">SINCE</text>
  <text class="mono" x="57" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#3b82f6">2022</text>
  <rect x="384" y="118" width="78" height="62" rx="12" fill="#8b949e" fill-opacity="0.08" stroke="#8b949e" stroke-opacity="0.4"/>
  <text x="423" y="138" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6e7781" letter-spacing="2">REPS</text>
  <g class="mono" font-size="24" font-weight="700" fill="#3b82f6" text-anchor="middle">
    <text class="c0" opacity="0" x="423" y="167">00</text>
    <text class="c1" opacity="0" x="423" y="167">01</text>
    <text class="c2" opacity="0" x="423" y="167">02</text>
    <text class="c3" x="423" y="167">03</text>
  </g>

  <ellipse class="glow" cx="240" cy="132" rx="150" ry="80" fill="url(#glowG)"/>
  <ellipse class="shadow fb" cx="240" cy="236" rx="118" ry="7" fill="#000000" fill-opacity="0.22"/>

  <!-- sparkles -->
  <g fill="#f59e0b">
    <path class="spark fb" opacity="0" d="M100 66l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="spark fb" opacity="0" d="M380 66l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" style="animation-delay:.12s"/>
    <path class="spark fb" opacity="0" d="M240 76l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" style="animation-delay:.24s"/>
  </g>

  <g class="lift fb">
    <!-- bar and grip -->
    <rect x="116" y="144" width="248" height="12" rx="6" fill="url(#bar)"/>
    <rect x="200" y="139" width="80" height="22" rx="6" fill="url(#grip)"/>
    <rect x="200" y="139" width="80" height="22" rx="6" fill="url(#knurl)"/>
    <text class="mono" x="240" y="154.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" fill-opacity="0.85">&lt;/&gt;</text>
    <!-- collars -->
    <rect x="190" y="134" width="10" height="32" rx="3" fill="#9ca3af" stroke="#334155"/>
    <rect x="280" y="134" width="10" height="32" rx="3" fill="#9ca3af" stroke="#334155"/>
    <!-- inner plates: MOBILE and BACKEND -->
    <rect x="150" y="92" width="40" height="116" rx="10" fill="url(#react)" stroke="#334155"/>
    <rect x="290" y="92" width="40" height="116" rx="10" fill="url(#react)" stroke="#334155"/>
    <rect x="154" y="99" width="4" height="102" rx="2" fill="#fff" fill-opacity="0.22"/>
    <rect x="294" y="99" width="4" height="102" rx="2" fill="#fff" fill-opacity="0.22"/>
    <text transform="translate(171 150) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="800" fill="#c4b5fd" letter-spacing="1.6">MOBILE</text>
    <text transform="translate(311 150) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="800" fill="#4ade80" letter-spacing="1.6">BACKEND</text>
    <!-- outer plates: WEB and CLOUD -->
    <rect x="120" y="106" width="30" height="88" rx="8" fill="url(#outer)" stroke="#334155"/>
    <rect x="330" y="106" width="30" height="88" rx="8" fill="url(#outer)" stroke="#334155"/>
    <rect x="124" y="112" width="3" height="76" rx="1.5" fill="#fff" fill-opacity="0.25"/>
    <rect x="334" y="112" width="3" height="76" rx="1.5" fill="#fff" fill-opacity="0.25"/>
    <text transform="translate(136 150) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="800" fill="#fff" letter-spacing="1.6">WEB</text>
    <text transform="translate(346 150) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-size="10.5" font-weight="800" fill="#fff" letter-spacing="1.6">CLOUD</text>
    <!-- sweat -->
    <path class="sweatL" opacity="0" d="M214 120c-3 4-4 6-4 8a4 4 0 0 0 8 0c0-2-1-4-4-8z" fill="#38bdf8"/>
    <path class="sweatR" opacity="0" d="M266 120c-3 4-4 6-4 8a4 4 0 0 0 8 0c0-2-1-4-4-8z" fill="#38bdf8"/>
  </g>

  <!-- progress -->
  <rect x="140" y="252" width="200" height="6" rx="3" fill="#8b949e" fill-opacity="0.2"/>
  <rect class="fill" x="140" y="252" width="200" height="6" rx="3" fill="#3b82f6"/>
  <text class="loading" opacity="0" x="240" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#6e7781" letter-spacing="2">LOADING PROFILE…</text>
  <text class="unlocked" x="240" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#2da44e" letter-spacing="1.6">✓ PROFILE UNLOCKED — TAP THE DUMBBELL</text>
  </g>
</svg>
